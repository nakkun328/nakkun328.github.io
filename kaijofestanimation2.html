<canvas id="cv" width="1000" height="1000"></canvas>
</div>
<div id="bar"><button id="pp">一時停止</button><input id="sk" type="range" min="0" max="1000" value="0"><span id="tm">0.00s</span></div>
<script>
const T=2.0,LOOP=2.9,$=id=>document.getElementById(id),cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const flame=$('flame'),ink=$('ink'),glow=$('glow'),tb=$('tb'),dm=$('dm'),cv=$('cv'),c=cv.getContext('2d');
let s=7;const R=()=>(s=s*16807%2147483647)/2147483647;
const em=[...Array(70)].map(()=>({x:.22+R()*.6,y:.45+R()*.45,t0:.55+R()*.75,l:.7+R()*.9,vy:.25+R()*.45,dx:(R()-.5)*.12,sz:3+R()*6}));
function setMask(el,p){const m=`linear-gradient(to top,#000 ${p*135-35}%,#0000 ${p*135}%)`;el.style.webkitMaskImage=el.style.maskImage=m}
function setInk(p){const m=`linear-gradient(to bottom,#000 ${p*130-30}%,#0000 ${p*130}%)`;ink.style.webkitMaskImage=ink.style.maskImage=m}
function draw(t){
  // 1) ink brush-in (flame absent)
  const pi=eio(seg(t,0,.42));ink.style.opacity=pi>0?1:0;setInk(pi);
  // 2) flame ignites from below and billows upward
  const f=seg(t,.55,1.55),p=eo(f);
  flame.style.opacity=f>0?1:0;setMask(flame,p);
  flame.style.transform=`scale(${.84+.16*eo(seg(t,.55,1.7))}) translateY(${(1-p)*4}%)`;
  const wob=34*(1-seg(t,.55,1.9))*Math.sin(Math.PI*cl(seg(t,.55,.8)+.2,0,1))+(t>.55?5*Math.sin(t*16):0);
  dm.setAttribute('scale',Math.max(0,wob).toFixed(1));tb.setAttribute('seed',1+Math.floor(t*14));
  tb.setAttribute('baseFrequency',(.010+.003*Math.sin(t*6)).toFixed(4)+' '+(.016+.004*Math.cos(t*5)).toFixed(4));
  flame.style.filter=`url(#wob) blur(${(1-p)*7}px) saturate(${1+.5*(1-seg(t,.7,1.9))})`;
  // heat glow
  glow.style.opacity=(.65*eo(seg(t,.55,.95))*(1-.7*seg(t,.95,2))).toFixed(3);
  // 3) embers
  c.clearRect(0,0,1000,1000);
  em.forEach(e=>{const a=t-e.t0;if(a<0||a>e.l)return;const k=a/e.l,x=(e.x+e.dx*a+Math.sin(a*9+e.sz)*.012)*1000,y=(e.y-e.vy*a)*1000,al=Math.sin(Math.PI*k)*(.6+.4*Math.sin(t*30+e.sz));
    const g=c.createRadialGradient(x,y,0,x,y,e.sz*2.6);g.addColorStop(0,`rgba(255,196,110,${al})`);g.addColorStop(.4,`rgba(255,110,40,${al*.7})`);g.addColorStop(1,'rgba(255,110,40,0)');c.fillStyle=g;c.fillRect(x-e.sz*3,y-e.sz*3,e.sz*6,e.sz*6)});
}
let t=0,playing=true,last=performance.now();
function frame(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(playing){t+=dt;if(t>=LOOP)t=0}draw(Math.min(t,T));$('sk').value=Math.min(t,T)/T*1000;$('tm').textContent=Math.min(t,T).toFixed(2)+'s';requestAnimationFrame(frame)}
$('pp').onclick=()=>{playing=!playing;$('pp').textContent=playing?'一時停止':'再生'};
$('sk').oninput=()=>{playing=false;$('pp').textContent='再生';t=$('sk').value/1000*T};
requestAnimationFrame(n=>{last=n;frame(n)});
</script>
