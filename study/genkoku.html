const SN={こと:"ことばとは何か",マル:"マルジャーナの知恵",文化:"文化記号論"};
const KEY='genkoku-qa-v1';
let st={};try{st=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
st.q=st.q||{};st.k=st.k||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
let tab='q',sec='全部',ngOnly=false,shuffled=false,kmode='read',open=new Set(),order=null;
const $=id=>document.getElementById(id);
const data=()=>tab==='q'?Q.map(x=>({s:x[0],a:x})):K.map(x=>({s:SN[x[2]],a:x}));
const rec=()=>st[tab];
function chips(){
  const secs=['全部',...new Set(data().map(d=>d.s))];
  $('flt').innerHTML=secs.map(s=>`<button class="${s===sec?'on':''}" data-s="${s}">${s}</button>`).join('');
  $('modeRow').innerHTML=tab==='k'?`<button data-m="read" class="${kmode==='read'?'on':''}">読み（漢字→ひらがな）</button><button data-m="write" class="${kmode==='write'?'on':''}">書き（カタカナ→漢字）</button>`:'';
}
$('flt').onclick=e=>{const s=e.target.dataset.s;if(s){sec=s;open.clear();chips();render()}};
$('modeRow').onclick=e=>{const m=e.target.dataset.m;if(m){kmode=m;open.clear();chips();render()}};
const kata=s=>s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
function card(i,d){
  const r=rec()[i]||'',op=open.has(i);
  let body;
  if(tab==='q'){const [,q,a,n]=d.a;
    body=`<div><span class="n">${i+1}</span>${q}</div><div class="ans ${op?'':'hid'}" data-a="${i}"><span>${a}</span>${n?`<span class="note">${n}</span>`:''}</div>`;
  }else{const [w,y,,c]=d.a;
    const shown=kmode==='read'?w:kata(y),hidden=kmode==='read'?y:w;
    const ctx=kmode==='read'?c:c.split(w).join('〔'+kata(y)+'〕');
    body=`<div><span class="n">${i+1}</span><span class="big">${shown}</span></div><div class="ctx">${ctx}</div><div class="ans ${op?'':'hid'}" data-a="${i}"><span>${hidden}</span></div>`;
  }
  return `<div class="q ${r==='o'?'ok':r==='x'?'ng':''}">${body}<div class="row"><button class="o ${r==='o'?'on':''}" data-o="${i}">○</button><button class="x ${r==='x'?'on':''}" data-x="${i}">×</button></div></div>`;
}
function render(){
  const D=data(),R=rec();
  const idx=(order&&order.length===D.length?order:D.map((_,i)=>i)).filter(i=>(sec==='全部'||D[i].s===sec)&&(!ngOnly||R[i]==='x'));
  let h='',last='';
  idx.forEach(i=>{if(!shuffled&&D[i].s!==last){h+=`<div class="sec">${D[i].s}</div>`;last=D[i].s}h+=card(i,D[i])});
  $('list').innerHTML=h||'<p class="meta">該当なし</p>';
  const pool=D.map((_,i)=>i).filter(i=>sec==='全部'||D[i].s===sec);
  const o=pool.filter(i=>R[i]==='o').length,x=pool.filter(i=>R[i]==='x').length;
  $('stat').textContent=`${pool.length}問中 ○${o}・×${x}・未${pool.length-o-x}`;
  $('pg').style.width=(o/pool.length*100)+'%';
  $('bNg').classList.toggle('on',ngOnly);$('bShuf').classList.toggle('on',shuffled);
  $('summary').innerHTML=tab==='q'?`<div class="sec">3つの評論の共通点</div><div class="sum">
  <b>ことばとは何か</b>：ことばの意味は、隣接する他の語との<b>差異</b>で決まる。ことばが世界に切れ目を入れ、「もの」はことばと同時に生まれる。<br><br>
  <b>マルジャーナの知恵</b>：情報の価値は、ほかとの<b>差異</b>にある。資本主義は差異から利潤を生み、現代は差異そのもの（情報）を商品化している。<br><br>
  <b>文化記号論</b>：人間は<b>言語という文化装置</b>を通してしか現実を構成できない。名前があって初めて、ものは意味をもって現れる。<br><br>
  → 共通点：<b>意味や価値は、もの自体にあらかじめ備わっているのではなく、言語や差異（関係）によって生まれる。</b></div>`:'';
}
$('list').onclick=e=>{const t=e.target.closest('[data-a],[data-o],[data-x]');if(!t)return;
  if(t.dataset.a!==undefined){const i=+t.dataset.a;open.has(i)?open.delete(i):open.add(i);t.classList.toggle('hid');return}
  const i=+(t.dataset.o??t.dataset.x),v=t.dataset.o!==undefined?'o':'x',R=rec();
  if(R[i]===v)delete R[i];else R[i]=v;save();open.add(i);render()};
function setTab(t){tab=t;sec='全部';ngOnly=false;shuffled=false;order=null;open.clear();$('tQ').classList.toggle('on',t==='q');$('tK').classList.toggle('on',t==='k');chips();render()}
$('tQ').onclick=()=>setTab('q');$('tK').onclick=()=>setTab('k');
$('bAll').onclick=()=>{open.clear();render()};
$('bShow').onclick=()=>{data().forEach((_,i)=>open.add(i));render()};
$('bShuf').onclick=()=>{shuffled=!shuffled;const n=data().length;order=[...Array(n).keys()];
  if(shuffled)for(let i=n-1;i>0;i--){const j=Math.random()*(i+1)|0;[order[i],order[j]]=[order[j],order[i]]}else order=null;open.clear();render()};
$('bNg').onclick=()=>{ngOnly=!ngOnly;open.clear();render()};
$('bReset').onclick=()=>{if(confirm('このタブの○×記録を消す？')){st[tab]={};save();render()}};
chips();render();
</script>
