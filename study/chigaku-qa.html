.ans{position:relative}

.ans.hid::before{content:"タップで答え";position:absolute;left:10px;top:8px;color:var(--sub);font-weight:400;font-size:13px}
.ans .note{display:block;font-weight:400;font-size:13px;color:var(--sub)}
.row{display:flex;gap:6px;margin-top:8px}
.row button{padding:4px 14px}
.row .o.on{background:var(--ok);border-color:var(--ok);color:#fff}
.row .x.on{background:var(--ng);border-color:var(--ng);color:#fff}
table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0 4px;background:var(--card)}
td,th{border:1px solid var(--line);padding:5px 6px;text-align:center}
.tblwrap{overflow-x:auto}

let shuffled=false;
document.getElementById('list').onclick=e=>{const t=e.target.closest('[data-a],[data-o],[data-x]');if(!t)return;
  if(t.dataset.a!==undefined){const i=+t.dataset.a;open.has(i)?open.delete(i):open.add(i);t.classList.toggle('hid');return}
  const i=+(t.dataset.o??t.dataset.x),v=t.dataset.o!==undefined?'o':'x';
  rec[i]=rec[i]===v?undefined:v;if(!rec[i])delete rec[i];save();open.add(i);render()};
document.getElementById('bAll').onclick=()=>{open.clear();render()};
document.getElementById('bShow').onclick=()=>{Q.forEach((_,i)=>open.add(i));render()};
document.getElementById('bShuf').onclick=()=>{shuffled=!shuffled;
  order=Q.map((_,i)=>i);if(shuffled)for(let i=order.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[order[i],order[j]]=[order[j],order[i]]}
  document.getElementById('bShuf').classList.toggle('on',shuffled);open.clear();render()};
document.getElementById('bNg').onclick=()=>{ngOnly=!ngOnly;open.clear();render()};
document.getElementById('bReset').onclick=()=>{if(confirm('○×の記録を消す？')){rec={};save();render()}};
chips();render();
</script>
</body>
</html>
