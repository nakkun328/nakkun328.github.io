<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第135代 海城祭 — 10秒PV「烽」本編</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#05070f;color:#f6ead6;font-family:"Hiragino Sans","Yu Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;padding:12px}
#stage{width:min(100%,1200px);aspect-ratio:16/9;border-radius:10px;overflow:hidden;box-shadow:0 20px 80px #ff6a1f22;background:#000}
canvas{width:100%;height:100%;display:block}
#bar{width:min(100%,1200px);display:flex;gap:14px;align-items:center}
button{background:none;border:1px solid #ffb34788;color:#ffb347;border-radius:20px;padding:7px 18px;font-size:14px;cursor:pointer}
input{flex:1;accent-color:#ff8a3d}
#tm{font-variant-numeric:tabular-nums;font-size:13px;opacity:.7;min-width:78px;text-align:right}
</style>

<body>
<div id="stage"><canvas id="cv" width="1920" height="1080"></canvas></div>
<div id="bar"><button id="pp">一時停止</button><input id="sk" type="range" min="0" max="1000" value="0"><span id="tm">0.0 / 10.0s</span></div>
<script>
const W=1920,H=1080,D=10,cv=document.getElementById('cv'),c=cv.getContext('2d');
const FONT='"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif',INK='#231815',RED='#d9482b',PAPER='#f4ead8';
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const A=(t,a,b,f=.4)=>cl((t-a)/f)*cl((b-t)/f);
function rng(s){return()=>(s=s*16807%2147483647)/2147483647}
const R=rng(135);
const smoke=[...Array(60)].map((_,i)=>({b:i*.03,x:W/2+(R()-.5)*40,ph:R()*6.28,fr:.8+R()*1.4,sp:130+R()*90,s0:40+R()*30,gr:70+R()*60,wd:25+R()*70,life:2.4+R()*1.2}));
const stars=[...Array(80)].map(()=>({x:R()*W,y:R()*H*.7,s:R()*2+.5,ph:R()*6.28}));
const burst=[...Array(90)].map(()=>({a:R()*6.283,sp:260+R()*900,s:2+R()*3}));
const embers=[...Array(80)].map(()=>({x:.2+R()*.6,y:.5+R()*.4,t0:2.3+R()*1.2,l:.8+R()*1.1,vy:.12+R()*.2,dx:(R()-.5)*.08,sz:3+R()*7}));
const inkI=new Image(),flI=new Image();
function glowDot(x,y,r,col,al){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${col},${al})`);g.addColorStop(1,`rgba(${col},0)`);c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)}
const setF=sz=>c.font=`800 ${sz}px ${FONT}`;
function txt(s,x,y,sz,col,p,sp=0,st=.1){
  if(p<=0)return;setF(sz);const ch=[...s],w=ch.map(k=>c.measureText(k).width),tot=w.reduce((a,b)=>a+b,0)+sp*(ch.length-1);let cx=x-tot/2;c.textAlign='left';c.textBaseline='middle';
  const ga=c.globalAlpha;ch.forEach((k,i)=>{const q=eo(cl(p*(1+(ch.length-1)*st)-i*st));c.globalAlpha=ga*q;c.fillStyle=col;c.fillText(k,cx,y+(1-q)*40);cx+=w[i]+sp});c.globalAlpha=ga}
function wipe(s,x,y,sz,col,p){
  if(p<=0)return;setF(sz);const tot=c.measureText(s).width,x0=x-tot/2,e=eio(p);
  c.save();c.beginPath();c.rect(x0-20,y-sz,(tot+40)*e,sz*2);c.clip();c.textAlign='left';c.textBaseline='middle';c.fillStyle=col;c.fillText(s,x0,y);c.restore();
  if(p<1){const ex=x0+(tot+40)*e-20,g=c.createLinearGradient(ex-60,0,ex+10,0);g.addColorStop(0,'rgba(217,72,43,0)');g.addColorStop(1,'rgba(217,72,43,.8)');c.fillStyle=g;c.fillRect(ex-60,y-sz*.55,70,sz*1.1)}}
function line(x,y,w,p,col=INK,h=3){c.fillStyle=col;c.fillRect(x-w/2*eo(p),y,w*eo(p),h)}
// offscreen layers
const fcv=document.createElement('canvas');fcv.width=800;fcv.height=871;const fc=fcv.getContext('2d');
const icv=document.createElement('canvas');icv.width=700;icv.height=871;const ic=icv.getContext('2d');
const noise=document.createElement('canvas');noise.width=noise.height=256;{const n=noise.getContext('2d'),d=n.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=120+R()*135;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}n.putImageData(d,0,0)}
let noisePat;
function maskGrad(g,ctx,y0,y1,p){const s1=cl(p*1.35-.35),s2=cl(p*1.35),gr=ctx.createLinearGradient(0,y0,0,y1);gr.addColorStop(0,'#000');gr.addColorStop(s1,'#000');gr.addColorStop(s2,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,0)');return gr}
function logo(t,cx,cy,lh){
  const sc=lh/871,lw=700*sc,ox=cx-lw/2,oy=cy-lh/2;
  const fs=2.3,f=seg(t,fs,fs+1.0),p=eo(f);
  // heat glow
  const gl=.7*eo(seg(t,fs,fs+.4))*(1-.7*seg(t,fs+.4,fs+1.5));if(gl>0){c.save();c.globalCompositeOperation='multiply';glowDot(cx+lw*.1,cy+lh*.08,lh*.95,'255,150,70',gl);c.restore()}
  // flame (multiply), wobble by strips
  if(f>0){fc.clearRect(0,0,800,871);fc.globalCompositeOperation='source-over';
    const amp=26*(1-seg(t,fs,fs+1.4))*Math.sin(Math.PI*cl(seg(t,fs,fs+.25)+.2))+3.5;
    for(let y=0;y<871;y+=5){const dx=amp*Math.sin(y*.02+t*9)+amp*.5*Math.sin(y*.055-t*13);fc.drawImage(flI,0,y,700,5,50+dx,y,700,5)}
    fc.globalCompositeOperation='destination-in';fc.fillStyle=maskGrad(0,fc,871,0,p);fc.fillRect(0,0,800,871);
    const k=(.84+.16*eo(seg(t,fs,fs+1.15)))*(1+.008*Math.sin(t*7)),ax=cx,ay=cy+lh*.38;
    c.save();c.globalCompositeOperation='multiply';c.translate(ax,ay);c.scale(k,k);c.translate(-ax,-ay+(1-p)*lh*.04);c.drawImage(fcv,ox-50*sc,oy,800*sc,lh);c.restore()}
  // ink brush-in
  const pi=eio(seg(t,1.75,2.2));if(pi>0){ic.clearRect(0,0,700,871);ic.globalCompositeOperation='source-over';ic.drawImage(inkI,0,0);ic.globalCompositeOperation='destination-in';
    const s1=cl(pi*1.3-.3),s2=cl(pi*1.3),gr=ic.createLinearGradient(0,0,0,871);gr.addColorStop(0,'#000');gr.addColorStop(s1,'#000');gr.addColorStop(s2,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,0)');ic.fillStyle=gr;ic.fillRect(0,0,700,871);
    c.drawImage(icv,ox,oy,lw,lh)}
  // embers
  embers.forEach(e=>{const a=t-e.t0;if(a<0||a>e.l)return;const k=a/e.l,x=ox+(e.x+e.dx*a+Math.sin(a*9+e.sz)*.012)*lw,y=oy+(e.y-e.vy*a*1.2)*lh,al=Math.sin(Math.PI*k)*(.65+.35*Math.sin(t*30+e.sz)),r=e.sz*2.6;
    const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(255,196,110,${al})`);g.addColorStop(.4,`rgba(255,110,40,${al*.7})`);g.addColorStop(1,'rgba(255,110,40,0)');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)})
}
function draw(t){
  c.globalAlpha=1;c.globalCompositeOperation='source-over';
  let g;const ir=3000;
  if(ir>0){c.save();c.beginPath();c.arc(W/2,H/2,ir,0,6.283);c.clip();
    g=c.createRadialGradient(W/2,H*.45,0,W/2,H*.45,H);g.addColorStop(0,'#fbf4e6');g.addColorStop(.6,PAPER);g.addColorStop(1,'#e6d6b8');c.fillStyle=g;c.fillRect(0,0,W,H);
    noisePat=noisePat||c.createPattern(noise,'repeat');c.save();c.globalCompositeOperation='multiply';c.globalAlpha=.07;c.fillStyle=noisePat;c.fillRect(0,0,W,H);c.restore();
    smoke.forEach(p=>{const a=t-p.b;if(a<=0||a>p.life)return;const y=H+60-a*p.sp,x=p.x+Math.sin(a*p.fr+p.ph)*(18+a*22)+p.wd*a*a*.35,r=p.s0+p.gr*a,k=cl(1-a/1.4);glowDot(x,y,r,`${Math.round(110+120*k)},${Math.round(92+30*k)},${Math.round(88-20*k)}`,Math.sin(Math.PI*a/p.life)*.2*(1-seg(t,2.2,3.4)))});
    glowDot(W/2,H+60,700,'255,130,50',.28*(1-seg(t,1.4,2.4))*seg(t,0,.5));
    // logo placement
    const u1=eio(seg(t,4.3,5)),u2=eio(seg(t,8.6,9.3));
    logo(t,960-440*u1+440*u2,540-140*u2,800-20*u1-140*u2+0*u2);
    c.globalAlpha=1;c.strokeStyle=`rgba(35,24,21,${.22*seg(t,3,3.8)})`;c.lineWidth=2;c.strokeRect(48,48,W-96,H-96);
    // S2 message
    let a=A(t,4.5,6.8,.4);if(a>0){c.globalAlpha=a;
      txt('第135代  海城祭',1340,330,76,RED,seg(t,4.7,5.4),22);line(1340,395,640,seg(t,5,5.6),RED,4);
      wipe('大きな動きの合図を送る煙、のろし。',1340,520,50,INK,seg(t,5.2,5.95));
      wipe('燃え盛る情熱を、新しい文化祭の合図に。',1340,620,50,INK,seg(t,5.8,6.6));}
    // S3 date
    a=A(t,6.7,8.7,.4);if(a>0){c.globalAlpha=a;
      txt('2026',1340,290,64,INK,seg(t,6.8,7.4),34);
      txt('9.19 — 9.20',1340,470,170,RED,seg(t,6.9,7.7),6,.1);
      line(1340,590,700,seg(t,7.5,8.1));
      txt('9:00 – 16:00',1340,690,66,INK,seg(t,7.6,8.3),20,.08);
      txt('海城中学校・高等学校',1340,800,38,INK,seg(t,8,8.5),10,.06);}
    // S4 end
    a=A(t,8.9,99,.4);if(a>0){c.globalAlpha=a;
      txt('第135代  海城祭',960,780,78,INK,seg(t,8.95,9.6),24,.06);
      const pw=520,ph=92,px=960-pw/2,py=860,pr=ph/2,q=eo(seg(t,9.3,9.85));c.globalAlpha=a*q;c.fillStyle=INK;c.beginPath();c.moveTo(px+pr,py);c.arc(px+pw-pr,py+pr,pr,-1.5708,1.5708);c.arc(px+pr,py+pr,pr,1.5708,4.7124);c.fill();
      txt('kaijofes.com',960,py+pr+3,46,PAPER,1,8,0)}
    c.restore();
    if(t>1.2&&t<2.5){c.globalAlpha=1;c.strokeStyle=`rgba(217,72,43,${.8*(1-seg(t,1.2,2.4))})`;c.lineWidth=10*(1-seg(t,1.2,2.4));c.beginPath();c.arc(W/2,H/2,1150*eo(seg(t,1.2,2.4)),0,6.283);c.stroke()}}
  c.globalAlpha=1;
  // ---- spark + burst
  if(t<1.3){const p=eio(seg(t,.1,1.2));for(let i=0;i<14;i++){const q=Math.max(0,p-i*.012),y=H+20-(H/2+20)*q,x=W/2+Math.sin(q*9)*16*(1-q);glowDot(x,y,34-i*2,'255,170,70',(1-i/14)*.8*(t>.1?1:0))}}
  const ba=t-1.2;if(ba>0&&ba<2){burst.forEach(b=>{const d=b.sp*(1-Math.exp(-ba*2.4))/2.4,x=W/2+Math.cos(b.a)*d,y=H/2+Math.sin(b.a)*d+120*ba*ba,al=1-ba/2;glowDot(x,y,b.s*6,'255,140,50',al*.85);c.fillStyle=`rgba(235,90,30,${al})`;c.fillRect(x,y,b.s,b.s)})}
  c.globalAlpha=1;
}
const pp=document.getElementById('pp'),sk=document.getElementById('sk'),tm=document.getElementById('tm');
let t=0,playing=true,last=performance.now(),hold=0;
function frame(n){const dt=Math.min(.05,(n-last)/1000);last=n;
  if(playing){if(t>=D){hold+=dt;if(hold>1.2){t=0;hold=0}}else t=Math.min(D,t+dt)}
  draw(t);sk.value=t/D*1000;tm.textContent=t.toFixed(1)+' / 10.0s';requestAnimationFrame(frame)}
pp.onclick=()=>{playing=!playing;pp.textContent=playing?'一時停止':'再生'};
sk.oninput=()=>{t=sk.value/1000*D;hold=0};
const go=()=>requestAnimationFrame(n=>{last=n;frame(n)});
const ld=im=>new Promise(r=>{im.onload=im.onerror=r});
